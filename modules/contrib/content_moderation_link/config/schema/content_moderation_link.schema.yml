content_moderation_link.settings:
  type: config_object
  label: 'Content Moderation Link Settings'
  mapping:
    allow_multiple:
      type: integer
      label: 'Allow multiple IDs'
    skip_errors:
      type: integer
      label: 'Skip errors'
    destination:
      type: string
      label: 'Destination Route'
    entity_types:
      label: Entity Types
      type: sequence
      sequence:
        type: string
    moderation_states:
      label: Moderation States
      type: sequence
      sequence:
        type: string
