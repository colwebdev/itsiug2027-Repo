# Schema for the configuration files of the Event Platform Scheduler module.
event_platform_scheduler.settings:
  type: config_object
  label: 'Event Platform Scheduler Config'
  mapping:
    types:
      type: sequence
      label: 'Content types to schedule.'
      translatable: false
      sequence:
        type: string
        label: 'Content Type'
    states:
      type: sequence
      label: 'Workflow states to include.'
      translatable: false
      sequence:
        type: string
        label: 'Workflow State'
    filters:
      type: sequence
      label: 'Filters to include.'
      translatable: false
      sequence:
        type: string
        label: 'Filter'
