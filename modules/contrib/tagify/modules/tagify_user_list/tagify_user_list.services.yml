services:
  tagify_user_list.user_image:
    class: Drupal\tagify_user_list\UserImageResolver
    arguments:
      - '@entity_field.manager'
      - '@entity_type.manager'
      - '@string_translation'
  tagify_user_list.autocomplete_matcher:
    class: Drupal\tagify_user_list\TagifyUserListEntityAutocompleteMatcher
    parent: tagify.autocomplete_matcher
    calls:
      - [setUserImageResolver, ['@tagify_user_list.user_image']]
