itsiug_registration.access:
  path: '/register'
  defaults:
    _form: '\Drupal\itsiug_registration\Form\InstitutionAccessForm'
    _title: 'Institution Registration'
  requirements:
    _access: 'TRUE'

itsiug_registration.info:
  path: '/registerinfo'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::registerInfo'
    _title: 'Registration Information'
  requirements:
    _access: 'TRUE'

itsiug_registration.logout:
  path: '/register/logout'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::logout'
    _title: 'Registration Access'
  requirements:
    _access: 'TRUE'

itsiug_registration.delegate:
  path: '/register/delegate'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::delegateForm'
    _title: 'Delegate Registration'
  requirements:
    _access: 'TRUE'

itsiug_registration.delegate_confirmation:
  path: '/register/delegate/confirmation'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::delegateConfirmation'
    _title: 'Delegate Registration'
  requirements:
    _access: 'TRUE'

itsiug_registration.delegate_cancel:
  path: '/register/delegate/{delegate}/cancel'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::cancelDelegate'
    _title: 'Cancel Delegate'
  requirements:
    _access: 'TRUE'
    delegate: '\d+'
    
itsiug_registration.dashboard:
  path: '/register/dashboard'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::dashboard'
    _title: 'Institution Delegate Dashboard'
  requirements:
    _custom_access: '\Drupal\itsiug_registration\Access\RegistrationAccessCheck::access'
    
itsiug_registration.scanner:
  path: '/register/scanner'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::scanner'
    _title: 'Conference Scanner'
  requirements:
    _permission: 'access itsiug admin'

itsiug_registration.scanner_process:
  path: '/register/scanner/process'
  methods: [POST]
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::scannerProcess'
  requirements:
    _permission: 'access itsiug admin'
    _csrf_request_header_token: 'TRUE'

itsiug_registration.test_certificate:
  path: '/register/test-certificate/{registration}'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::testCertificate'
    _title: 'Test Certificate'
  requirements:
    _access: 'TRUE'
    registration: '\d+'

itsiug_registration.test_badge:
  path: '/register/test-badge/{registration}'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::testBadge'
    _title: 'Test Badge'
  requirements:
    _access: 'TRUE'
    registration: '\d+'

itsiug_registration.admin_certificate_generate:
  path: '/register/admin/certificates/{registration}/generate'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::adminGenerateCertificate'
    _title: 'Generate Certificate'
  requirements:
    _permission: 'access itsiug admin'
    registration: '\d+'

itsiug_registration.admin_badges:
  path: '/register/admin/badges'
  defaults:
    _form: '\Drupal\itsiug_registration\Form\BadgeManagementForm'
    _title: 'ITSIUG 2027 Badge Management'
  requirements:
    _permission: 'access itsiug admin'

itsiug_registration.admin_badge_generate:
  path: '/register/admin/badges/{registration}/generate'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::adminGenerateBadge'
    _title: 'Generate Badge'
  requirements:
    _permission: 'access itsiug admin'
    registration: '\d+'

itsiug_registration.admin_badges_bulk_download:
  path: '/register/admin/badges/bulk-download'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::adminDownloadBadgesBulk'
    _title: 'Download Bulk Badges PDF'
  requirements:
    _permission: 'access itsiug admin'
    
itsiug_registration.reports:
  path: '/register/reports'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::reports'
    _title: 'ITSIUG 2027 Reports'
  requirements:
    _custom_access: '\Drupal\itsiug_registration\Access\AdminAccessCheck::reports'

itsiug_registration.reports_csv:
  path: '/register/reports/csv'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::reportsCsv'
    _title: 'ITSIUG 2027 Delegate Report'
  requirements:
    _permission: 'access itsiug reports'

itsiug_registration.institution_report:
  path: '/register/institution-report'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::institutionReport'
    _title: 'ITSIUG 2027 Membership Payment Report'
  requirements:
    _custom_access: '\Drupal\itsiug_registration\Access\AdminAccessCheck::excoMember'

itsiug_registration.admin_delegates:
  path: '/register/admin/delegates'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::adminDelegates'
    _title: 'ITSIUG 2027 Delegate Management'
  requirements:
    _custom_access: '\Drupal\itsiug_registration\Access\AdminAccessCheck::admin'

itsiug_registration.admin_delegate_contacts:
  path: '/register/admin/delegate-contacts'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::adminDelegateContacts'
    _title: 'ITSIUG 2027 Delegate Contact Details'
  requirements:
    _custom_access: '\Drupal\itsiug_registration\Access\AdminAccessCheck::admin'

itsiug_registration.badge_scanner:
  path: '/badge/scanner'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::badgeScanner'
    _title: 'Delegate Badge'
  requirements:
    _access: 'TRUE'
    
itsiug_registration.admin:
  path: '/register/admin'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::admin'
    _title: 'ITSIUG 2027 Administration'
  requirements:
    _custom_access: '\Drupal\itsiug_registration\Access\AdminAccessCheck::admin'

itsiug_registration.admin_certificates:
  path: '/register/admin/certificates'
  defaults:
    _controller: '\Drupal\itsiug_registration\Controller\RegistrationController::adminCertificates'
    _title: 'ITSIUG 2027 Certificate Management'
  requirements:
    _permission: 'access itsiug admin'