$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Logistics Accordion Item
group: Molecules
status: stable
description: An accordion item for the Logistics page.

props:
  type: object
  properties:
    admin_theme:
      title: Admin Theme
      type: boolean
      default: false
      description: Use the standard Convene admin theme styling.

    title:
      title: Title
      type: string
      description: Accordion heading.

slots:
  content:
    title: Content
    description: Add formatted content, text, tables, or other Canvas components.
