id: delegate_registration
title: 'Delegate Registration'
description: '<p>Register a delegate for ITSIUG 2027.</p>'
categories: {  }
elements: |-
  individual_group:
    '#type': radios
    '#title': 'Are you registering as an individual or as part of a Group'
    '#options':
      Individual: 'Individual -- You are responsible for processing the Invoice.'
      Group: 'Group -- One Invoice will be issued for the Group/Institution'
  what_is_the_name_of_the_group:
    '#type': textfield
    '#title': 'What is the name of the Group?'
    '#states':
      visible:
        ':input[name="individual_group"]':
          value: Group
  title:
    '#type': webform_select_other
    '#title': Title
    '#options':
      Prof: Prof
      Dr: Dr
      Mr: Mr
      Mrs: Mrs
      Miss: Miss
      Ms: Ms
  first_name:
    '#type': textfield
    '#title': 'First Name'
  last_name:
    '#type': textfield
    '#title': 'Last Name'
  email:
    '#type': email
    '#title': Email
  country:
    '#type': webform_select_other
    '#title': Country
    '#options':
      'South Africa': 'South Africa'
      Botswana: Botswana
      Namibia: Namibia
      Eswatini: Eswatini
  mobile:
    '#type': textfield
    '#title': Mobile
  job_title:
    '#type': textfield
    '#title': 'Job Title'
  track_preference:
    '#type': select
    '#title': 'Track Preference'
    '#options':
      'Student Track': 'Student Track'
      'Finance Track': 'Finance Track'
      'HR/Payroll Track': 'HR/Payroll Track'
      'Technical Track': 'Technical Track'
      'No Preference': 'No Preference'
  dietary_requirements:
    '#type': select
    '#title': 'Dietary Requirements'
    '#options':
      Vegetarian: Vegetarian
      Vegan: Vegan
      Halal: Halal
      None: None
  please_confirm_your_choice:
    '#type': radios
    '#title': 'Please confirm your choice:'
    '#options':
      Quotation: 'I first want to be QUOTED and invoiced after I mail you the PO Number'
      Invoice: 'You may INVOICE me directly'
